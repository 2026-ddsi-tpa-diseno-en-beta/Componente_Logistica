spring.datasource.url=jdbc:h2:mem:logistica-integration;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.application.name=logistica
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.datadog.metrics.export.enabled=false
management.otlp.metrics.export.enabled=false
management.health.rabbit.enabled=false
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
logistica.messaging.enabled=false
integrations.donadores-url=http://localhost:1
integrations.donaciones-url=http://localhost:1
logistica.api-url=http://localhost:1
springdoc.api-docs.enabled=true
app.component=logistica
