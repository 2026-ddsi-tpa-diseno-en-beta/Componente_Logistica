spring.config.activate.on-profile=worker

server.port=${PORT:10000}

integrations.donadores-url=${DONADORES_URL}

logistica.api-url=${LOGISTICA_API_URL}

app.component=worker
worker.id=${WORKER_ID:${RENDER_INSTANCE_ID:${INSTANCE_NAME:logistica-worker}}}
app.instance-id=${worker.id}

management.metrics.tags.service=donatrack-logistica-worker
management.metrics.tags.environment=production
management.metrics.tags.component=worker

spring.rabbitmq.addresses=${RABBITMQ_URL}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.otlp.metrics.export.enabled=${GRAFANA_OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${GRAFANA_OTLP_METRICS_URL:}
management.otlp.metrics.export.headers.Authorization=${GRAFANA_OTLP_HEADERS:}
management.otlp.metrics.export.step=30s
management.otlp.metrics.export.aggregation-temporality=cumulative
management.prometheus.metrics.export.enabled=false
management.datadog.metrics.export.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
